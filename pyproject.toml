[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bedrock-converse"
version = "0.2.0"
description = "Python SDK for AWS Bedrock Converse API with tool calling, embeddings, and vector search"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pydantic>=2.0",
    "json5",
    "json-repair",
    "jsonschema"
]

[project.optional-dependencies]
aws = ["boto3>=1.28"]
openai = ["openai>=1.0"]
image = ["pillow>=9.0"]
all = ["boto3>=1.28", "pillow>=9.0", "openai>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]
